<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SysAdmin Knowledge Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="shop-name">SysAdmin Knowledge</h1>
    <p>Open daily 6:30-18:00</p>
    <button id="theme-btn">Toggle dark mode</button>
  </header>
  <main>
    <div id="filters">
      <button data-category="All">All</button>
      <button data-category="Coffee">Coffee</button>
      <button data-category="Tea">Tea</button>
      <button data-category="Pastries">Pastries</button>
    </div>
    <button id="sort-btn">Sort by price</button>
    <ul id="menu-list"></ul>
    <div id="cart">
      <p id="cart-summary">Cart: 0 items, total $0.00</p>
    </div>
  </main>
  <script src="menu-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
